<!DOCTYPE html>

       <html>

    <body>
        <style>
        body {
            background: black;
            color: green;
            text-align: center;
        }
        p{
            font-size: 80px;
        }
        button{
            font-size: 20px;
            padding: 10px 20px;
        }

        </style>
    <h1>contador anquilossauro engraxado</h1>
    <p id="valor">0</p>
    <button onclick="aumentar()">aumentar</button>
    <button onclick="diminuir()">diminuir</button>
    <button onclick="zerar()">zerar</button>
    

    <script>
    
        let numero = 0;

        function aumentar(){
            numero = numero  + 1
            document.getElementById("valor").textContent = numero;
        }
        function diminuir(){
            numero = numero  - 1;
            document.getElementById("valor").textContent = numero;
        }
        function zerar(){
            numero = 0;
            document.getElementById("valor").textContent = numero;
        }
    </script>

    </body>
    
</html>
